<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Draft Championship · PlayHuud</title>
  <style>
    body{margin:0;background:#150f19;color:#f9f0d8;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}
    main{box-sizing:border-box;max-width:540px;width:calc(100% - 32px);padding:32px;background:#241b2b;border:1px solid #70538a;border-radius:20px}
    h1{font-size:2rem;line-height:1.15;margin:8px 0 20px}p{line-height:1.55;color:#dac9e5}
    .eyebrow{color:#ffc664;font-size:.8rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
    .count{font-size:1.25rem;font-weight:750;color:#ffc664}button,a.button{display:block;box-sizing:border-box;width:100%;padding:14px 16px;margin-top:12px;text-align:center;border:0;border-radius:12px;background:#ffc664;color:#211321;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}
    .secondary{background:#3b2a48!important;color:#f9f0d8!important}.code{font-size:1.6rem;font-weight:850;letter-spacing:.25em;color:#ffc664}
  </style>
</head>
<body><main>
  <div class="eyebrow">PlayHuud · Draft knockout</div>
  <h1 id="name">Championship invitation</h1>
  <p id="details">Loading the invitation…</p>
  <p class="count" id="count"></p>
  <p>Invitation code<br><span class="code" id="code"></span></p>
  <a class="button" id="open" href="#">Open in PlayHuud</a>
  <button class="secondary" id="copy">Copy code</button>
  <p>New to PlayHuud? <a href="/">Get the app</a>, create your account, then enter this code in Draft Championships.</p>
</main>
<script>
  const code = location.pathname.split('/').filter(Boolean).pop().toUpperCase();
  const valid = /^[A-HJ-NP-Z2-9]{8}$/.test(code);
  document.getElementById('code').textContent = valid ? code : 'Invalid code';
  document.getElementById('open').href = valid ? 'playhuud:///championships/' + code : '/';
  document.getElementById('copy').onclick = () => navigator.clipboard.writeText(code);
  if (valid) fetch('/api/v1/championships/invite/' + encodeURIComponent(code) + '/preview')
    .then(r => { if (!r.ok) throw new Error('Invitation not found'); return r.json(); })
    .then(c => {
      document.getElementById('name').textContent = c.name;
      const start = new Date(c.scheduledAt).toLocaleString();
      document.getElementById('details').textContent = 'Draft · single elimination · starts ' + start + ' · ' + c.visibility;
      document.getElementById('count').textContent = c.joined + ' / ' + c.size + ' players joined';
    }).catch(e => document.getElementById('details').textContent = e.message);
</script></body></html>
