<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Join my Huud · PlayHuud</title>
  <meta property="og:title" content="Join my Huud on PlayHuud">
  <meta property="og:description" content="Hang out, talk and play games together.">
  <style>
    body{margin:0;background:#140c06;color:#fff3e4;font:16px system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}
    main{box-sizing:border-box;max-width:520px;width:calc(100% - 32px);padding:28px;background:linear-gradient(160deg,#ff9a3c,#ff7a1a);color:#241708;border:2px solid #241708;border-radius:24px;box-shadow:0 18px 40px rgba(255,138,31,.35)}
    .eyebrow{font-size:.8rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    h1{font-size:2rem;line-height:1.1;margin:10px 0 6px}
    p{line-height:1.5;margin:6px 0}
    .code{font-size:1.7rem;font-weight:900;letter-spacing:.3em;background:#ffe9cf;border-radius:14px;padding:10px 14px;display:inline-block;margin:10px 0}
    a.button,button{display:block;box-sizing:border-box;width:100%;padding:15px 16px;margin-top:12px;text-align:center;border:0;border-radius:16px;background:#241708;color:#fff3e4;font:inherit;font-weight:900;text-decoration:none;cursor:pointer}
    .light{background:#ffe9cf!important;color:#241708!important}
    .small{font-size:.9rem;opacity:.85}
  </style>
</head>
<body><main>
  <div class="eyebrow">🎉 PlayHuud invite</div>
  <h1 id="name">Join my Huud</h1>
  <p id="details">Hang out, talk and play games together.</p>
  <div class="code" id="code"></div>
  <a class="button" id="open" href="#">Open in PlayHuud</a>
  <a class="button light" id="get" href="/">Get the app</a>
  <p class="small" id="after">After you sign up, PlayHuud takes you straight into this Huud.</p>
</main>
<script>
  // Where to get the app. Android: the PlayHuud APK (until it's on Google Play).
  // iPhone: set to the App Store (or a public TestFlight) link once it's live.
  const ANDROID_URL = '/downloads/playhuud.apk';
  const IOS_URL = '';

  const code = (location.pathname.split('/').filter(Boolean).pop() || '').toUpperCase();
  const valid = /^[A-Z0-9]{6}$/.test(code);
  const link = 'https://playhuud.com/huud/' + code;
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua);
  const android = /Android/.test(ua);

  document.getElementById('code').textContent = valid ? code : 'Invalid link';
  // The app opens this straight away if it's installed.
  document.getElementById('open').href = valid ? 'playhuud:///huud/' + code : '/';

  const get = document.getElementById('get');
  if (android) { get.href = ANDROID_URL; get.textContent = 'Get PlayHuud for Android'; }
  else if (ios && IOS_URL) { get.href = IOS_URL; get.textContent = 'Get PlayHuud on the App Store'; }
  else if (ios) { get.href = '/'; get.textContent = 'PlayHuud for iPhone'; }
  // Getting the app: remember this Huud (on the clipboard), so after sign-up
  // the app can take you straight in.
  get.addEventListener('click', () => { if (valid && navigator.clipboard) navigator.clipboard.writeText(link).catch(() => {}); });

  if (valid) fetch('/api/v1/huud-spaces/invite/' + encodeURIComponent(code) + '/preview')
    .then(r => { if (!r.ok) throw new Error('This Huud isn’t around any more.'); return r.json(); })
    .then(h => {
      document.title = h.name + ' · PlayHuud';
      document.getElementById('name').textContent = 'Join ' + h.name;
      document.getElementById('details').textContent = (h.live ? '🔴 Live now · ' : '') + h.members + (h.members === 1 ? ' member' : ' members') + ' · made by ' + h.owner;
    })
    .catch(e => { document.getElementById('details').textContent = e.message; });
</script></body></html>
