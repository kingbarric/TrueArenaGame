name: truearena
description: PlayHuud — social party games.
publish_to: "none"
version: 1.0.1+2026100801

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  # The feed's countdown reads clock.now() so tests can move time.
  clock: ^1.1.1
  web_socket_channel: ^3.0.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^8.2.0
  speech_to_text: ^7.5.0
  flutter_svg: ^2.0.10+1
  livekit_client: ^2.3.4
  permission_handler: ^11.3.1
  flutter_contacts: ^2.5.0
  share_plus: ^10.1.4
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  just_audio: ^0.9.42
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/branding/
    - assets/images/game_icons/
    - assets/music/
    - assets/sfx/

dependency_overrides:
  google_sign_in_ios: 5.7.1
