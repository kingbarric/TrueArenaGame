# Single-instance production stack. Pulled and started by the `deploy` job in
# .github/workflows/ci.yml via SSH — see that job for the exact command.
#
# Required on the deploy host before the first run:
#   - a `.env` file (or exported shell env) next to this file providing:
#       BACKEND_IMAGE       e.g. ghcr.io/<owner>/<repo>-backend:latest
#       DB_PASSWORD, JWT_SECRET, LIVEKIT_API_KEY, LIVEKIT_API_SECRET,
#       BREVO_API_KEY (to send email verification codes)
#     (no dev defaults are baked in here on purpose — see docker-compose.yml
#     for the dev-only version with placeholder secrets)
#   - `docker login ghcr.io` once, so `docker compose pull` can read the image
#
# APP_ENV=production is what backend/ta-api's EnvironmentGuard checks at boot
# to fail fast if SPRING_PROFILES_ACTIVE is ever accidentally "local" here.

name: truearena-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: truearena
      POSTGRES_USER: truearena
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truearena -d truearena"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--notify-keyspace-events", "Ex", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.7.2
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      # Real keys stay out of the mounted config file; LiveKit merges this
      # env var with the file's port/logging settings.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml:ro

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE, e.g. ghcr.io/<owner>/<repo>-backend:latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      APP_ENV: production
      PORT: 8080
      R2DBC_URL: r2dbc:postgresql://postgres:5432/truearena
      JDBC_URL: jdbc:postgresql://postgres:5432/truearena
      DB_USERNAME: truearena
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LIVEKIT_URL: ${LIVEKIT_URL:?set LIVEKIT_URL, e.g. wss://your-domain}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      # Public Web OAuth client ID; override when using a different Google project.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-26187322342-o2squi475tmt3ubs8k9rh2d2b7pfivgf.apps.googleusercontent.com}
      # Shared secret for the /notvisible/analytics admin dashboard (X-Admin-Key header).
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
    ports: ["8080:8080"]

  # Reverse proxy + automatic Let's Encrypt. Needs DOMAIN set to a real hostname that
  # resolves to this host (a bare IP can't get a Let's Encrypt cert) — see Caddyfile.prod.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [backend, livekit]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to a real hostname that resolves to this host}
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443" # LiveKit signaling over wss:// — see Caddyfile.prod
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ../website:/srv/playhuud:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
