# Production LiveKit config. Unlike livekit.yaml (dev), this has no `keys:`
# section — real keys are supplied via the LIVEKIT_KEYS env var in
# docker-compose.prod.yml so no secret ever lives in a checked-in file.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50020
  use_external_ip: true
logging:
  level: info
