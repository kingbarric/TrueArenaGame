spring:
  application:
    name: truearena-backend
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/truearena}
    username: ${DB_USERNAME:truearena}
    password: ${DB_PASSWORD:truearena}
  flyway:
    enabled: true
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/truearena}
    user: ${DB_USERNAME:truearena}
    password: ${DB_PASSWORD:truearena}
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}
  error:
    # Without this, Spring drops the reason off every ResponseStatusException
    # and the client gets a bare status with no body message — so a refusal
    # we wrote a careful explanation for ("not enough coins to stake 100")
    # surfaced in the app as a generic "something went wrong". The client
    # reads `message` (see ApiClient._send, Flutter); this is what puts it
    # there. Safe to expose: every message here is one we authored in
    # ApiExceptions, never a stack trace or internal detail.
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

truearena:
  email:
    brevo-api-key: ${BREVO_API_KEY:}
    sender-address: verify@playhuud.com
  auth:
    jwt-secret: ${JWT_SECRET:dev-only-change-me-0000000000000000000000000000}
    access-ttl: 15m
    refresh-ttl: 30d
    # Google Web OAuth client ID; must match the Flutter serverClientId.
    # Override via GOOGLE_CLIENT_ID for another environment.
    google-client-id: ${GOOGLE_CLIENT_ID:26187322342-o2squi475tmt3ubs8k9rh2d2b7pfivgf.apps.googleusercontent.com}
    # Native iOS Sign in with Apple ID-token audience (the app's bundle ID).
    apple-client-id: ${APPLE_CLIENT_ID:app.truearena.truearena}
  livekit:
    url: ${LIVEKIT_URL:ws://localhost:7880}
    api-key: ${LIVEKIT_API_KEY:devkey}
    api-secret: ${LIVEKIT_API_SECRET:devsecret_devsecret_devsecret_1234}
  admin:
    # Shared secret for the /notvisible/analytics dashboard's API calls (X-Admin-Key
    # header) — see AdminKeyFilter. Blank means every admin request is refused.
    api-key: ${ADMIN_API_KEY:}
  push:
    # Base64 of the Firebase service-account JSON (Firebase console → Project
    # settings → Service accounts → Generate new private key). Blank means
    # push notifications are disabled — see FirebaseConfig/PushNotificationService.
    firebase-credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
  competitive:
    # Games with a skill rating + leaderboards (comma-separated). Adding a game
    # here is all it takes once its GameModule exists — see CompetitiveSettings.
    rated-game-types: ${COMPETITIVE_RATED_GAMES:draughts}
    # Rated games before a player stops being provisional and can appear on a board.
    placement-games: 10
    # Rated games one pair of accounts can play against each other per 24h
    # before further games between them are recorded unrated (alt-farming guard).
    max-rated-games-per-pair-per-day: 5
    # Ranking-location changes: first correction is immediate, later ones wait
    # this long; past max-location-changes it needs support.
    location-cooldown-days: 30
    max-location-changes: 3

# Cyber Agent brains. Both read from the environment only — never paste a
# key here. Gemini wins when both are present (see BotLlmConfig); with
# neither set, agents fall back to random legal moves and still play.
gemini:
  api:
    key: ${GEMINI_API_KEY:}

groq:
  api:
    key: ${GROQ_API_KEY:}

logging:
  level:
    root: INFO
    app.truearena: DEBUG

---
spring:
  config:
    activate:
      on-profile: local
truearena:
  auth:
    otp-dev-bypass-code: "000000"
