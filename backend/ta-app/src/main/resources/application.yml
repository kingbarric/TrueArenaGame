spring:
  application:
    name: truearena-backend
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/truearena}
    username: ${DB_USERNAME:truearena}
    password: ${DB_PASSWORD:truearena}
  flyway:
    enabled: true
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/truearena}
    user: ${DB_USERNAME:truearena}
    password: ${DB_PASSWORD:truearena}
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}
  error:
    # Without this, Spring drops the reason off every ResponseStatusException
    # and the client gets a bare status with no body message — so a refusal
    # we wrote a careful explanation for ("not enough coins to stake 100")
    # surfaced in the app as a generic "something went wrong". The client
    # reads `message` (see ApiClient._send, Flutter); this is what puts it
    # there. Safe to expose: every message here is one we authored in
    # ApiExceptions, never a stack trace or internal detail.
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

truearena:
  auth:
    jwt-secret: ${JWT_SECRET:dev-only-change-me-0000000000000000000000000000}
    access-ttl: 15m
    refresh-ttl: 30d
    # The Google Cloud "Web" OAuth client ID — see docs/DEV_REFERENCE.md for the
    # full setup. Blank until set: /auth/google returns 400 rather than pretending
    # to work. Comma-separate more than one if ever needed (e.g. staging + prod).
    google-client-id: ${GOOGLE_CLIENT_ID:}
  livekit:
    url: ${LIVEKIT_URL:ws://localhost:7880}
    api-key: ${LIVEKIT_API_KEY:devkey}
    api-secret: ${LIVEKIT_API_SECRET:devsecret_devsecret_devsecret_1234}

# Cyber Agent brains. Both read from the environment only — never paste a
# key here. Gemini wins when both are present (see BotLlmConfig); with
# neither set, agents fall back to random legal moves and still play.
gemini:
  api:
    key: ${GEMINI_API_KEY:}

groq:
  api:
    key: ${GROQ_API_KEY:}

logging:
  level:
    root: INFO
    app.truearena: DEBUG

---
spring:
  config:
    activate:
      on-profile: local
truearena:
  auth:
    otp-dev-bypass-code: "000000"
