<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SlayHuud character preview</title><style>body{margin:0;background:#171d29;color:white;font:16px sans-serif}nav{position:absolute;z-index:1;padding:14px}canvas{display:block}select,button{font:inherit;padding:8px}#status{display:block;margin:8px}</style></head><body><nav><select id="avatar"><option value="ella">Ella · Curvy</option><option value="beverly">Elisabeth · Slim</option><option value="girl02">Chloe</option><option value="indian-male">Ethan</option><option value="male">Alexander</option></select><select id="pose"><option>signature</option><option>idle</option><option>confident</option><option>editorial</option><option>celebrate</option></select><select id="skin"><option value="original">Original skin</option><option>#c79782</option><option>#623a27</option><option>#e6bea0</option></select><button id="turn">Turn</button><button id="show">Catwalk</button><span id="status">Loading</span></nav><script type="module">
import * as T from 'three';import {Wardrobe} from './src/avatar.ts';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#171d29');scene.add(new T.HemisphereLight(0xffffff,0x777777,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(2,3,4);scene.add(light);const camera=new T.PerspectiveCamera(30,innerWidth/innerHeight,.01,100);camera.position.set(0,1.10,4.5);camera.lookAt(0,1,0);addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});const wardrobe=new Wardrobe(renderer);scene.add(wardrobe.root);const catalog=await(await fetch('/catalog.json')).json();catalog.version=Date.now();
window.preview={wardrobe,catalog,renderer,scene,camera};
let request=0;async function apply(){const current=++request;const id=document.querySelector('#avatar').value,body=['indian-male','male'].includes(id)?'male':'female';document.querySelector('#status').textContent='Loading';try{await wardrobe.apply({avatarId:id,body,skinTone:document.querySelector('#skin').value==='original'?(catalog.avatars.find(a=>a.id===id).naturalSkinTone??'#623a27'):document.querySelector('#skin').value,facePreset:'classic',pose:document.querySelector('#pose').value,background:'studio',items:body==='male'?{outfit:'male-essential',hair:'male-hair-0',shoes:'shoe-1'}:{hair:'female-hair-long'}},catalog);if(current===request)document.querySelector('#status').textContent='Ready'}catch(e){if(current===request)document.querySelector('#status').textContent=e.message;console.error(e)}}
for(const id of ['avatar','pose','skin'])document.querySelector('#'+id).onchange=apply;document.querySelector('#turn').onclick=()=>wardrobe.root.rotation.y+=Math.PI/2;document.querySelector('#show').onclick=()=>wardrobe.showOff();const clock=new T.Clock();renderer.setAnimationLoop(()=>{wardrobe.update(clock.getDelta());renderer.render(scene,camera)});apply();
</script></body></html>
