<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>html,body{margin:0;overflow:hidden;background:#fff0df}canvas{display:block}#names{position:absolute;inset:0;pointer-events:none}.name{position:absolute;left:0;top:0;pointer-events:auto;border:1px solid #f5b97f;border-radius:99px;background:#fffaf0eb;color:#70300c;font:700 10px system-ui;padding:4px 6px;white-space:nowrap;box-shadow:0 2px 7px #0002}.name:after{content:'';position:absolute;left:calc(50% + var(--head,0px));top:100%;width:1px;height:var(--stem,4px);background:#90a58d88;pointer-events:none}.name.talking{border-color:#3b9662;background:#e4f6e5}.name.talking:before{content:'▂▅▃';font-size:13px;color:#26854d;margin-right:5px;animation:talk .7s ease-in-out infinite alternate}.name.away{opacity:.6}@keyframes talk{from{opacity:.45}to{opacity:1}}@media(prefers-reduced-motion:reduce){.name.talking:before{animation:none}}#start-game{position:absolute;z-index:10;transform:translate(-50%,-50%);border:2px solid #532509;border-radius:13px;padding:11px 14px;background:#ff8a1f;color:#281609;font:900 13px system-ui;white-space:nowrap;box-shadow:0 4px 0 #82350b;cursor:pointer}#start-game:active{background:#ffac5c}#start-game[hidden]{display:none}</style></head><body><div id="names"></div><div style="position:fixed;top:8px;left:8px;z-index:200;background:#fffaf0;padding:8px;border-radius:12px;font:12px system-ui"><label>Avatar <select id="avatar"></select></label> <label>Outfit <select id="outfit"></select></label> <button id="sit">Sit</button> <button id="stand">Stand</button> <button id="walk">Walk</button> <button id="presence">Ava leave / return</button> <span id="status">Loading</span></div>
<script>
const data=Promise.all([fetch('/catalog.json').then(r=>r.json()),fetch('/huud-options.json').then(r=>r.json()),fetch('/asset-manifest.json').then(r=>r.json())]);
let config,options,generation=0,activePeople=[];
const look=(avatarId,outfitId)=>{const a=options.avatars.find(a=>a.id===avatarId),o=options.outfits.find(o=>o.id===outfitId),items={...(a.body==='female'?o.female:o.male),hair:a.hair,shoes:'shoe-1'};return {body:a.body,avatarId:a.id,skinTone:a.skinTone,facePreset:'classic',pose:'idle',background:'studio',items,itemColours:Object.fromEntries(Object.entries(o.colours).filter(([slot])=>items[slot]))};};
const populate=()=>{const people=Array.from({length:12},(_,i)=>({id:'preview'+i,name:['Riley','Ava','Michael','Chloe','Ethan','Ella','Oliver','Grace','Sophia','James','Maya','Lucas'][i],host:i===0,here:true,speaking:i===1,me:i===0,look:look(i===0?document.querySelector('#avatar').value:options.avatars[i%5].id,i===0?document.querySelector('#outfit').value:options.outfits[i%10].id)}));activePeople=people;document.querySelector('#status').textContent='Loading';window.huudReceive({type:'init',generation:++generation,catalog:config,people});};
window.flutter_inappwebview={callHandler:async(_,event)=>{if(event.type==='ready'){const [c,o,manifest]=await data;if(config)return;config=c;options=o;const base=location.origin+'/delivered/';for(const a of c.avatars){for(const key of ['assetUrl','fitUrl'])if(a[key])a[key]=base+manifest.files[a[key]].name;}for(const item of c.items)if(item.assetUrl)item.assetUrl=base+manifest.files[item.assetUrl].name;for(const [id,values]of [['avatar',o.avatars],['outfit',o.outfits]])document.querySelector('#'+id).innerHTML=values.map(v=>'<option value="'+v.id+'">'+v.name+'</option>').join('');for(const id of ['avatar','outfit'])document.querySelector('#'+id).onchange=populate;for(const id of ['sit','stand','walk'])document.querySelector('#'+id).onclick=()=>window.huudReceive({type:'selfAction',mode:id});document.querySelector('#presence').onclick=()=>{activePeople[1].here=!activePeople[1].here;window.huudReceive({type:'people',people:activePeople});document.querySelector('#status').textContent=activePeople[1].here?'Ava entering':'Ava leaving';};populate();}else if(event.type==='game')document.querySelector('#status').textContent='Opened Game tab';else if(event.type==='loaded')document.querySelector('#status').textContent='Ready';else if(event.type==='error')document.querySelector('#status').textContent=event.message;}};
</script><script type="module" src="/src/huud-lounge.ts"></script></body></html>
