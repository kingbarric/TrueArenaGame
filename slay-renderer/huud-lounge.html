<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>html,body{margin:0;overflow:hidden;background:#fff0df}canvas{display:block}#names{position:absolute;inset:0;pointer-events:none}.name{position:absolute;left:0;top:0;pointer-events:auto;border:1px solid #f5b97f;border-radius:99px;background:#fffaf0eb;color:#70300c;font:700 10px system-ui;padding:4px 6px;white-space:nowrap;box-shadow:0 2px 7px #0002}.name .host-badge{width:14px;height:14px;object-fit:contain;vertical-align:-3px;margin-right:3px}.name:after{content:'';position:absolute;left:calc(50% + var(--head,0px));top:100%;width:1px;height:var(--stem,4px);background:#90a58d88;pointer-events:none}.name.talking{border-color:#3b9662;background:#e4f6e5}.name.talking:before{content:'▂▅▃';font-size:13px;color:#26854d;margin-right:5px;animation:talk .7s ease-in-out infinite alternate}.name.away{opacity:.6}@keyframes talk{from{opacity:.45}to{opacity:1}}@media(prefers-reduced-motion:reduce){.name.talking:before{animation:none}}#start-game{position:absolute;z-index:10;transform:translate(-50%,-50%);border:2px solid #532509;border-radius:13px;padding:11px 14px;background:#ff8a1f;color:#281609;font:900 13px system-ui;white-space:nowrap;box-shadow:0 4px 0 #82350b;cursor:pointer}#start-game:active{background:#ffac5c}#start-game[hidden]{display:none}</style></head><body><div id="names"></div><script type="module" src="/src/huud-lounge.ts"></script></body></html>
