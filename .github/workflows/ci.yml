name: CI

on:
  pull_request:
  push:
    branches: [main, release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp verify -DskipITs
      - uses: actions/upload-artifact@v4
        with:
          name: backend-runtime
          path: backend/ta-app/target/truearena-backend.jar
          retention-days: 3

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers uses the host Docker daemon (present on ubuntu-latest).
      # failsafe runs only @Tag("integration") tests.
      - run: ./mvnw -B -ntp verify

  secret-data-guarantee:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Build Brief §8 / Plan 11.5 — FullGameContractIT: 6 real accounts, one ad-hoc room,
      # 6 real WebSocket connections played to GAME_OVER, secret-data guarantee checked on
      # every frame every client actually received. @Tag("integration") + Testcontainers
      # (Postgres + Redis), so this needs failsafe/verify, not plain surefire/test.
      - run: ./mvnw -B -ntp -pl ta-contract-tests -am verify

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Existing advisory lints remain visible; analyzer errors still fail CI.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  contract-codegen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install jsonschema pyyaml
      - name: Validate contract test vectors against the schema
        run: ./tools/check_contract.sh
      - name: Validate production release packaging
        run: |
          python3 tools/test_release_bundle.py
          bash -n infra/deploy-production-ci.sh infra/ci-deploy-production-restricted.sh
          python3 -c "import yaml; yaml.safe_load(open('infra/docker-compose.prod.yml')); yaml.safe_load(open('.github/workflows/ci.yml'))"

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Verify the backend Docker build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          # Production receives the tested runtime artifact through its scoped key.
          push: false
          tags: truearena-backend:ci-${{ github.sha }}

  deploy:
    needs: [backend-build, backend-integration, secret-data-guarantee, flutter, contract-codegen-check, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-runtime
          path: backend/ta-app/target
      - name: Configure the production-only deployment connection
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ vars.PROD_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/production_deploy
          chmod 600 ~/.ssh/production_deploy
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy the verified release artifact and public configuration
        env:
          PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
          PROD_DEPLOY_USER: ${{ vars.PROD_DEPLOY_USER }}
        run: bash infra/deploy-production-ci.sh

  deploy-test:
    needs: [backend-build, flutter, contract-codegen-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-runtime
          path: backend/ta-app/target
      - name: Configure SSH for the isolated test stack
        env:
          TEST_SSH_KEY: ${{ secrets.TEST_DEPLOY_SSH_KEY }}
          TEST_KNOWN_HOSTS: ${{ vars.TEST_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TEST_SSH_KEY" > ~/.ssh/test_deploy
          chmod 600 ~/.ssh/test_deploy
          printf '%s\n' "$TEST_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy main to test and verify health
        env:
          TEST_DEPLOY_HOST: ${{ vars.TEST_DEPLOY_HOST }}
          TEST_DEPLOY_USER: ${{ vars.TEST_DEPLOY_USER }}
        run: bash infra/deploy-test-ci.sh
